<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <nav class="navbar md:navbar-expand">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
                                Menu
                            </button>
                            <div class="menu">
                                <a class="menu-item" href="#">Action</a>
                                <a class="menu-item" href="#">Another action</a>
                                <hr class="menu-divider">
                                <a class="menu-item" href="#">Something else here</a>
                            </div>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search" name="anything" />
                        <button class="btn-solid btn-icon theme-secondary" type="submit">
                            <svg class="bi" width="16" height="16">
                                <use href="#search" />
                            </svg>
                        </button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>

    <div class="container mt-12">
        <div class="row">
            <h1 class="text-center mb-6">ToDo List <i class="bi bi-fire"></i><i class="bi bi-fire"></i></h1>
            <form class="d-flex gap-4" id="taskForm">
                <label class="form-control form-adorn form-adorn-end ">
                    <input type="text" class="form-ghost" placeholder="Task" id="taskInput" name="taskInput">
                </label>
                <button class="btn-solid theme-success" type="submit">Add</button>
            </form>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="tasks d-flex flex-column gap-5">

                <!-- <div class="task border rounded d-flex justify-content-between align-items-center p-3">
                    <p class="m-0">Some quick example text to build on the card title and make up the bulk of the
                        card’s content.</p>
                    <a href="#" class="btn-solid theme-danger">Delete</a>
                </div> -->

            </div>
        </div>
    </div>

    <!-- Bootstrap scripts -->
    <script type="module" src="js/bootstrap.bundle.min.js"></script>

    <!-- Main logic -->
    <script src="js/index.js"></script>
</body>

</html>
